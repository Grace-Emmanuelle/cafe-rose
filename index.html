<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Rose</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--En-tête avec le logo à gauche et le menu à droite -->
    <header>
      <!--Le contener pour englober le logo et le menu-->
      <div class="nav-contener">
        <!--Le logo est le nom du site-->
        <h1 class="logo">CAFÉ <span>ROSE</span></h1>
        <!--Le menu de notre site à droite-->
        <nav>
          <!--Menu de notre site-->
          <ul class="nav-links">
            <li><a href="#">Accueil</a></li>
            <li><a href="#">Notre histoire</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Commander</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!--Premiere Section: Image principale.-->
    <section class="hero">
      <img src="a10.jpg" alt="image de presentation du Café" />
    </section>
    <!--Deuxieme section: Contenant le formulaire à gauche et la video à droite -->
    <section class="content-section">
      <!--Commentaire pour englober le formulaire et la video-->
      <!--Formulaire-->

      <div class="form-section">
        <h2>Formulaire d'inscription</h2>
        <form action="" method="post">
          <label for="nom">Nom:</label>
          <input type="text" id="non" name="nom" required />

          <label for="prenom">Prenom:</label>
          <input type="text" id="prenom" name="prenom" required />

          <label for="adresse">Adresse:</label>
          <input type="text" id="adresse" name="adresse" required />

          <label for="telephone">Telephone:</label>
          <input type="tel" id="telephone" name="telephone" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="password">Mot de passe:</label>
          <input type="password" id="password" name="password" required />

          <label for="cpassword">Confirmer le mot de passe:</label>
          <input type="password" id="cpassword" name="cpassword" required />

          <button type="submit">S'inscrire</button>
        </form>
      </div>

      <!--Video-->
      <div class="video-section">
        <video controls autoplay>
          <source src="formation.mp4" type="video/mp4" />
          Votre navigateur ne supporte pas la video
        </video>
      </div>
    </section>
    <!--Pied de page-->
    <footer>
      <p>Ce site a été concu dans le cadre du cours du SEO, D-CLIC - 2026</p>
    </footer>
  </body>
</html>
